services:
  api:
    build: ./api
    ports:
      - "8000:8000"
    env_file:
      - ./api/.env
    volumes:
      - ./api:/app
      - ./src:/src
    environment:
      - PYTHONPATH=/app:/src
    networks:
      - app-network

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - api
    networks:
      - app-network

networks:
  app-network:
    driver: bridge